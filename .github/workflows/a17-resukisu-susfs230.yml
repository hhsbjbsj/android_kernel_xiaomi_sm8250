name: A17 ReSukiSU latest + SUSFS 2.3.0

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Target Device Code'
        required: true
        default: 'alioth'
        type: choice
        options:
          - alioth
          - apollo
          - cas
          - cmi
          - dagu
          - elish
          - enuma
          - lmi
          - munch
          - pipa
          - psyche
          - thyme
          - umi
      target_os:
        description: 'Target OS (HyperOS 4 / MIUI use miui)'
        required: true
        type: choice
        default: 'miui'
        options:
          - aosp
          - miui
          - both
      enable_kpm:
        description: 'Enable KPM (SukiSU-style). Latest ReSukiSU baseline keeps this off.'
        required: true
        type: boolean
        default: false

jobs:
  build-kernel:
    name: A17 ReSukiSU-latest SUSFS2.3 ${{ github.event.inputs.device }} ${{ github.event.inputs.target_os }} KPM=${{ github.event.inputs.enable_kpm }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - name: Checkout AstideLabs android17-aptusitu
      uses: actions/checkout@v4
      with:
        repository: AstideLabs/android_kernel_xiaomi_sm8250
        ref: android17-aptusitu
        fetch-depth: 1

    - name: Checkout CI overlay scripts
      uses: actions/checkout@v4
      with:
        ref: android17-aptusitu-susfs230
        path: _overlay
        fetch-depth: 1
        sparse-checkout: |
          .github/scripts
        sparse-checkout-cone-mode: false

    - name: Install overlay scripts into A17 tree
      run: |
        mkdir -p .github/scripts
        cp -a _overlay/.github/scripts/. .github/scripts/
        chmod +x .github/scripts/*.sh .github/scripts/*.py
        test -f include/linux/susfs.h
        test -f build_kernel.sh
        test -f .github/scripts/adapt-resukisu-latest-setup.py

    - name: Set up Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex gawk \
          git gnupg gperf imagemagick libncurses-dev \
          lib32readline-dev lib32z1-dev liblz4-tool \
          libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync \
          schedtool squashfs-tools xsltproc zip zlib1g-dev python3

    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ccache_mikernel
        key: kernel-ccache-a17-resukisu-latest-susfs230-${{ github.event.inputs.device }}-${{ github.run_id }}
        restore-keys: |
          kernel-ccache-a17-resukisu-latest-susfs230-${{ github.event.inputs.device }}-
          kernel-ccache-a17-

    - name: Setup zyc-clang 16 (A17 toolchain)
      run: |
        mkdir -p $HOME/zyc-clang
        cd $HOME/zyc-clang
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz
        tar -zxvf Clang-16.0.6-20260807.tar.gz

    - name: Full SUSFS 2.3.0 backport (GKI overlay + 4.19 hooks)
      run: |
        set -Eeuo pipefail
        bash -x .github/scripts/adapt-susfs230.sh
        grep -Fq '#define SUSFS_VERSION "v2.3.0"' include/linux/susfs.h
        grep -Fq 'susfs_is_current_proc_no_su()' fs/exec.c
        echo 'baseline_branch=AstideLabs/android17-aptusitu' >> adapt-susfs230-proof.txt

    - name: Use latest ReSukiSU main and keep stock dtbo
      env:
        ENABLE_KPM: ${{ github.event.inputs.enable_kpm }}
      run: |
        RESUKISU_SHA=$(git ls-remote https://github.com/ReSukiSU/ReSukiSU.git refs/heads/main | awk '{print $1}')
        if [ -z "$RESUKISU_SHA" ]; then
          echo 'failed to resolve ReSukiSU main SHA'
          exit 1
        fi
        echo "RESUKISU_SHA=$RESUKISU_SHA" >> "$GITHUB_ENV"
        echo "Resolved ReSukiSU main: $RESUKISU_SHA"
        python3 .github/scripts/adapt-resukisu-latest-setup.py "$RESUKISU_SHA"
        python3 - <<'PY'
        from pathlib import Path
        p = Path('build_kernel.sh')
        t = p.read_text()
        needle = 'echo "[+] AnyKernel3 adjusted successfully."'
        inject = needle + '''
    # HyperOS/MIUI first-splash: keep ROM dtbo, only replace boot Image+dtb
    sed -i 's/^flash_generic dtbo;/# flash_generic dtbo;/' anykernel/anykernel.sh
    grep -n 'flash_generic dtbo' anykernel/anykernel.sh || true
    echo "[*] Disabled AnyKernel dtbo flash"'''
        if 'Disabled AnyKernel dtbo flash' not in t:
            if needle not in t:
                raise SystemExit('cannot find AnyKernel3 adjusted marker')
            t = t.replace(needle, inject, 1)
        p.write_text(t)
        print('patched build_kernel.sh to skip dtbo flash')
        PY
        if [ "${ENABLE_KPM}" = "true" ]; then
          python3 - <<'PY'
        from pathlib import Path
        p = Path('build_kernel.sh')
        t = p.read_text().replace('-d KPM', '-e KPM')
        t = t.replace('scripts/config --file "${OUT_DIR}/.config" -d KPM || true', 'scripts/config --file "${OUT_DIR}/.config" -e KPM || true')
        p.write_text(t)
        PY
        fi
        echo 'KCFLAGS=-DMODULE_IMPORT_NS\(x\)= -DTWA_RESUME=1' >> "$GITHUB_ENV"
        grep -nE 'ReSukiSU|dtbo flash|KPM' build_kernel.sh | head

    - name: Build A17 miui with latest ReSukiSU
      env:
        INPUT_DEVICE: ${{ github.event.inputs.device }}
        INPUT_TARGET_OS: ${{ github.event.inputs.target_os }}
      run: |
        chmod +x build_kernel.sh
        DEVICE="${INPUT_DEVICE:-alioth}"
        TARGET_OS="${INPUT_TARGET_OS:-miui}"
        echo "Executing command: ./build_kernel.sh $DEVICE ksu $TARGET_OS"
        echo "ReSukiSU SHA: ${RESUKISU_SHA:-unknown}"
        ./build_kernel.sh "$DEVICE" ksu "$TARGET_OS"
        grep -Fq '#define SUSFS_VERSION "v2.3.0"' include/linux/susfs.h
        echo "resukisu_sha=${RESUKISU_SHA:-unknown}" >> adapt-susfs230-proof.txt
        echo 'resukisu_ref=main-latest' >> adapt-susfs230-proof.txt
        echo 'dtbo_flash=disabled' >> adapt-susfs230-proof.txt
        ls -lh APTKernel_*.zip || true

    - name: Upload artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: A17-ReSukiSU-latest-SUSFS230-nodtbo-${{ github.event.inputs.device || 'alioth' }}-${{ github.event.inputs.target_os || 'miui' }}-${{ github.run_number }}
        path: |
          APTKernel_*.zip
          adapt-susfs230.log
          adapt-susfs230-proof.txt
        if-no-files-found: warn
