name: Build KernelSU LKM (backslashxx) for K40

on:
  workflow_dispatch:
  push:
    branches:
      - android17-aptusitu-susfs230
    paths:
      - '.github/workflows/build-lkm-boot.yml'
      - '.github/scripts/patch-lkm-for-alioth.py'

jobs:
  build-lkm:
    name: Build LKM ksu.ko & ksuinit (4.19.325-Ikun-KirinNova)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
    - name: Checkout CI scripts from current repo
      uses: actions/checkout@v4
      with:
        path: _ci
        fetch-depth: 1

    - name: Checkout kernel tree (AstideLabs SM8250)
      uses: actions/checkout@v4
      with:
        repository: AstideLabs/android_kernel_xiaomi_sm8250
        ref: android17-aptusitu
        path: kernel
        fetch-depth: 1

    - name: Checkout backslashxx/KernelSU (staging-ksyscall-legacy)
      uses: actions/checkout@v4
      with:
        repository: backslashxx/KernelSU
        ref: staging-ksyscall-legacy
        path: KernelSU
        fetch-depth: 1

    - name: Set up Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex gawk \
          git gnupg gperf imagemagick libncurses-dev \
          lib32readline-dev lib32z1-dev liblz4-tool \
          libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync \
          schedtool squashfs-tools xsltproc zip zlib1g-dev python3 libelf-dev \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

    - name: Cache Clang Toolchain
      uses: actions/cache@v4
      id: cache-clang
      with:
        path: /home/runner/zyc-clang
        key: zyc-clang-16.0.6-20260807

    - name: Setup zyc-clang 16
      if: steps.cache-clang.outputs.cache-hit != 'true'
      run: |
        mkdir -p $HOME/zyc-clang
        cd $HOME/zyc-clang
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz
        tar -zxvf Clang-16.0.6-20260807.tar.gz

    - name: Apply Symbol Patch & Configure Kernel Tree
      run: |
        python3 _ci/.github/scripts/patch-lkm-for-alioth.py

        cd kernel
        sed -i 's/^SUBLEVEL = .*/SUBLEVEL = 325/' Makefile
        head -n 5 Makefile

        # Remove localversion files to avoid -cip135-st19 pollution
        rm -f localversion*
        # Touch empty .scmversion to avoid git commit hash pollution (-gxxxx)
        touch .scmversion

        export PATH="$HOME/zyc-clang/bin:$PATH"
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

        make -j$(nproc) CC=clang HOSTCC=clang LLVM=1 LLVM_IAS=1 alioth_defconfig

        scripts/config --file .config \
          --set-str LOCALVERSION "-Ikun-KirinNova" \
          --disable LOCALVERSION_AUTO \
          -e MODULES \
          -e MODULE_UNLOAD \
          -e MODVERSIONS \
          -e KALLSYMS \
          -e KALLSYMS_ALL \
          -e KPROBES \
          -e KRETPROBES \
          -e SECURITY_SELINUX \
          -e SECCOMP \
          -e KSU \
          -e KSU_HACK_ARM64_BRANCH_LINK

        make CC=clang HOSTCC=clang LLVM=1 LLVM_IAS=1 olddefconfig
        make -j$(nproc) CC=clang HOSTCC=clang LLVM=1 LLVM_IAS=1 prepare modules_prepare

        echo "=== VERIFIED KERNEL RELEASE ==="
        cat include/config/kernel.release
        echo "==============================="

        python3 ../_ci/.github/scripts/patch-lkm-for-alioth.py

    - name: Build ksu.ko
      run: |
        export PATH="$HOME/zyc-clang/bin:$PATH"
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

        KERNEL_DIR="$GITHUB_WORKSPACE/kernel"
        KSU_DIR="$GITHUB_WORKSPACE/KernelSU"

        cd "$KERNEL_DIR"

        make -j$(nproc) \
          ARCH=arm64 \
          SUBARCH=arm64 \
          CC="clang" \
          HOSTCC="clang" \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          LLVM=1 \
          LLVM_IAS=1 \
          M="$KSU_DIR/kernel" \
          modules

        test -f "$KSU_DIR/kernel/ksu.ko" || { echo "ksu.ko not found!"; exit 1; }
        echo "[+] Built ksu.ko successfully!"
        modinfo "$KSU_DIR/kernel/ksu.ko" || true
        llvm-strip --strip-debug "$KSU_DIR/kernel/ksu.ko" -o "$KSU_DIR/kernel/ksu_stripped.ko"
        cp "$KSU_DIR/kernel/ksu_stripped.ko" "$GITHUB_WORKSPACE/ksu.ko"

    - name: Build ksuinit for aarch64
      run: |
        rustup default stable
        rustup update stable
        rustup target add aarch64-linux-android
        
        if [ -z "$ANDROID_NDK_HOME" ]; then
          if [ -n "$ANDROID_NDK_LATEST_HOME" ]; then
            export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          else
            export ANDROID_NDK_HOME=$(find /usr/local/lib/android/sdk/ndk -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          fi
        fi
        echo "Using NDK: $ANDROID_NDK_HOME"

        cd "$GITHUB_WORKSPACE/KernelSU"
        chmod +x .github/scripts/setup-rust-build.sh
        source .github/scripts/setup-rust-build.sh aarch64-linux-android 26
        BUILTINS="$($CLANG_PATH --print-resource-dir)/lib/linux/libclang_rt.builtins-aarch64-android.a"
        if [ ! -f "$BUILTINS" ]; then
          BUILTINS=$(find "$ANDROID_NDK_HOME" -name "libclang_rt.builtins-aarch64*.a" | head -n 1)
        fi
        echo "Using BUILTINS: $BUILTINS"
        export RUSTFLAGS="-C target-feature=+crt-static -C link-arg=-Wl,-z,max-page-size=16384 -C link-arg=-Wno-unused-command-line-argument -C link-arg=$BUILTINS"
        cargo build --package ksuinit --target=aarch64-linux-android --release
        
        test -f target/aarch64-linux-android/release/ksuinit || { echo "ksuinit not found!"; exit 1; }
        cp target/aarch64-linux-android/release/ksuinit "$GITHUB_WORKSPACE/ksuinit"
        echo "[+] Built ksuinit successfully!"

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: KSU-LKM-Alioth-IkunKirinNova-${{ github.run_number }}
        path: |
          ksu.ko
          ksuinit
