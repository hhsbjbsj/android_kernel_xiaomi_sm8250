name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Target Device Code (设备代号)'
        required: true
        default: 'lmi'
        type: choice
        options:
          - alioth
          - apollo
          - cas
          - cmi
          - dagu
          - elish
          - enuma
          - lmi
          - munch
          - pipa
          - psyche
          - thyme
          - umi
      ksu:
        description: 'Enable KernelSU (ReSukiSU v4.2.0-rc1)'
        required: true
        type: boolean
        default: true
      target_os:
        description: 'Target OS (目标系统)'
        required: true
        type: choice
        default: 'miui'
        options:
          - aosp
          - miui
          - both
  push:
    branches:
      - sync/android16-upstream-20260830

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Set up Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex gawk \
          git gnupg gperf imagemagick libncurses-dev \
          lib32readline-dev lib32z1-dev liblz4-tool \
          libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync \
          schedtool squashfs-tools xsltproc zip zlib1g-dev python3

    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ccache_mikernel
        key: kernel-ccache-${{ github.run_id }}
        restore-keys: |
          kernel-ccache-

    - name: Setup zyc-clang 16 Toolchain
      run: |
        mkdir -p $HOME/zyc-clang
        cd $HOME/zyc-clang
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260510-release/Clang-16.0.6-20260510.tar.gz
        tar -zxvf Clang-16.0.6-20260510.tar.gz

    - name: Use ReSukiSU v4.2.0-rc1
      env:
        RESUKISU_VERSION: v4.2.0-rc1
      run: |
        python3 - <<'PY'
        from pathlib import Path

        build = Path('build_kernel.sh')
        text = build.read_text()
        old = 'curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash'
        version = 'v4.2.0-rc1'
        new = f'curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/{version}/kernel/setup.sh" | bash -s -- {version}'

        if old in text:
            build.write_text(text.replace(old, new, 1))
        elif version not in text:
            raise SystemExit('ReSukiSU setup command layout changed; refusing blind patch')
        PY

        # Keep only the two narrow 4.19 compatibility defines. Do not globally
        # force-include sched/task.h: that makes scripts/mod/empty.o depend on
        # generated/timeconst.h before the generated header exists.
        echo 'KCFLAGS=-DMODULE_IMPORT_NS\(x\)= -DTWA_RESUME=1' >> "$GITHUB_ENV"
        echo "ReSukiSU version: $RESUKISU_VERSION"
        grep -n 'ReSukiSU' build_kernel.sh | head

    - name: Run Build Script
      env:
        INPUT_DEVICE: ${{ github.event.inputs.device }}
        INPUT_KSU: ${{ github.event.inputs.ksu }}
        INPUT_TARGET_OS: ${{ github.event.inputs.target_os }}
      run: |
        chmod +x build_kernel.sh
        DEVICE="${INPUT_DEVICE:-lmi}"
        KSU="${INPUT_KSU:-true}"
        TARGET_OS="${INPUT_TARGET_OS:-miui}"
        ARGS="$DEVICE"

        if [ "$KSU" = "true" ]; then
          ARGS="$ARGS ksu"
        fi
        if [ "$TARGET_OS" != "both" ]; then
          ARGS="$ARGS $TARGET_OS"
        fi

        echo "Executing command: ./build_kernel.sh $ARGS"
        ./build_kernel.sh $ARGS

    - name: Upload Flashable ZIP
      uses: actions/upload-artifact@v4
      with:
        name: APTKernel-${{ github.run_id }}
        path: APTKernel_*.zip
        compression-level: 0
