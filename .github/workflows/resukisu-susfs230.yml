name: ReSukiSU SUSFS 2.3.0

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Target Device Codename'
        required: true
        default: 'alioth'
        type: choice
        options:
          - psyche
          - thyme
          - umi
          - munch
          - lmi
          - cmi
          - cas
          - apollo
          - alioth
          - elish
          - enuma
          - dagu
          - pipa
  push:
    branches: [resukisu-susfs230]
    paths:
      - '.github/workflows/resukisu-susfs230.yml'
      - '.github/scripts/adapt-susfs230.sh'
      - '.github/scripts/integrate-resukisu.sh'

env:
  RESUKISU_REPO: https://github.com/ReSukiSU/ReSukiSU.git
  RESUKISU_REF: v4.1.0

jobs:
  build:
    name: ReSukiSU + SUSFS 2.3.0 (${{ github.event.inputs.device || 'alioth' }})
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: resukisu-susfs230
          fetch-depth: 1

      - name: Cleanup disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git curl wget bison flex zip bc cpio libssl-dev ccache python-is-python3

      - name: Setup toolchain (ZyC-Clang 16)
        run: |
          mkdir -p "$HOME/zyc-clang"
          wget -q https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260510-release/Clang-16.0.6-20260510.tar.gz -O clang.tar.gz
          tar -zxf clang.tar.gz -C "$HOME/zyc-clang"
          rm -f clang.tar.gz

      - name: Adapt SUSFS 2.1.0 to 2.3.0 in the working tree only
        run: |
          chmod +x .github/scripts/adapt-susfs230.sh
          .github/scripts/adapt-susfs230.sh
          grep -Fq '#define SUSFS_VERSION "v2.3.0"' include/linux/susfs.h
          git diff --stat -- include/linux/susfs.h include/linux/susfs_def.h

      - name: Patch build script to use ReSukiSU instead of SukiSU
        run: |
          chmod +x .github/scripts/integrate-resukisu.sh
          .github/scripts/integrate-resukisu.sh

      - name: Build MIUI kernel with ReSukiSU and SUSFS 2.3.0
        env:
          DEVICE: ${{ github.event.inputs.device || 'alioth' }}
        run: |
          DEFCONFIG="arch/arm64/configs/${DEVICE}_defconfig"
          test -f "$DEFCONFIG"
          sed -i \
            -e '/^CONFIG_KPROBES=/d' \
            -e '/^# CONFIG_KPROBES is not set$/d' \
            -e '/^CONFIG_EXT4_FS=/d' \
            -e '/^# CONFIG_EXT4_FS is not set$/d' \
            "$DEFCONFIG"
          printf '\nCONFIG_KPROBES=y\nCONFIG_EXT4_FS=y\n' >> "$DEFCONFIG"
          unset KCFLAGS KCPPFLAGS
          export MAKEFLAGS='KCFLAGS=-DMODULE_IMPORT_NS\(x\)=\ -DTWA_RESUME=1 KCPPFLAGS=-include\ linux/sched/task.h'
          bash "$GITHUB_WORKSPACE/build-resukisu-susfs230.sh" "$DEVICE" ksu
          grep -Fq '#define SUSFS_VERSION "v2.3.0"' include/linux/susfs.h
          test -s "$GITHUB_WORKSPACE/adapt-susfs230-proof.txt"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: APT-ReSukiSU-SUSFS230-${{ github.event.inputs.device || 'alioth' }}-${{ github.run_number }}
          path: |
            ./*.zip
            adapt-susfs230.log
            adapt-susfs230-proof.txt
            out/.config
            out/arch/arm64/boot/Image
          if-no-files-found: warn
