name: ReSukiSU 4.2 + SUSFS 2.3.0

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Target Device Code'
        required: true
        default: 'alioth'
        type: choice
        options:
          - alioth
          - apollo
          - cas
          - cmi
          - dagu
          - elish
          - enuma
          - lmi
          - munch
          - pipa
          - psyche
          - thyme
          - umi
      target_os:
        description: 'Target OS'
        required: true
        type: choice
        default: 'miui'
        options:
          - aosp
          - miui
          - both
  push:
    branches:
      - sync-resukisu42-susfs230
    paths:
      - '.github/workflows/resukisu42-susfs230.yml'
      - '.github/scripts/adapt-susfs230.sh'

jobs:
  build-kernel:
    name: ReSukiSU 4.2 + SUSFS 2.3.0 (${{ github.event.inputs.device || 'alioth' }})
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - name: Checkout ReSukiSU 4.2 successful baseline
      uses: actions/checkout@v4
      with:
        ref: sync-resukisu42-susfs230
        fetch-depth: 1

    - name: Set up Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex gawk \
          git gnupg gperf imagemagick libncurses-dev \
          lib32readline-dev lib32z1-dev liblz4-tool \
          libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync \
          schedtool squashfs-tools xsltproc zip zlib1g-dev python3

    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ccache_mikernel
        key: kernel-ccache-resukisu42-susfs230-${{ github.run_id }}
        restore-keys: |
          kernel-ccache-

    - name: Setup zyc-clang 16 Toolchain
      run: |
        mkdir -p $HOME/zyc-clang
        cd $HOME/zyc-clang
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260510-release/Clang-16.0.6-20260510.tar.gz
        tar -zxvf Clang-16.0.6-20260510.tar.gz

    - name: Adapt SUSFS 2.2.0 to 2.3.0 in the working tree only
      run: |
        chmod +x .github/scripts/adapt-susfs230.sh
        .github/scripts/adapt-susfs230.sh
        grep -Fq '#define SUSFS_VERSION "v2.3.0"' include/linux/susfs.h

    - name: Use ReSukiSU v4.2.0-rc1
      env:
        RESUKISU_VERSION: v4.2.0-rc1
      run: |
        python3 - <<'PY'
        from pathlib import Path

        build = Path('build_kernel.sh')
        text = build.read_text()
        old = 'curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash'
        version = 'v4.2.0-rc1'
        new = f'curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/{version}/kernel/setup.sh" | bash -s -- {version}'

        if old in text:
            build.write_text(text.replace(old, new, 1))
        elif version not in text:
            raise SystemExit('ReSukiSU setup command layout changed; refusing blind patch')
        PY

        echo 'KCFLAGS=-DMODULE_IMPORT_NS\(x\)= -DTWA_RESUME=1' >> "$GITHUB_ENV"
        echo "ReSukiSU version: $RESUKISU_VERSION"
        grep -n 'ReSukiSU' build_kernel.sh | head

    - name: Run proven build script
      env:
        INPUT_DEVICE: ${{ github.event.inputs.device }}
        INPUT_TARGET_OS: ${{ github.event.inputs.target_os }}
      run: |
        chmod +x build_kernel.sh
        DEVICE="${INPUT_DEVICE:-alioth}"
        TARGET_OS="${INPUT_TARGET_OS:-miui}"
        echo "Executing command: ./build_kernel.sh $DEVICE ksu $TARGET_OS"
        ./build_kernel.sh "$DEVICE" ksu "$TARGET_OS"
        grep -Fq '#define SUSFS_VERSION "v2.3.0"' include/linux/susfs.h

    - name: Upload artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: APT-ReSukiSU42-SUSFS230-${{ github.event.inputs.device || 'alioth' }}-${{ github.run_number }}
        path: |
          APTKernel_*.zip
          adapt-susfs230.log
          adapt-susfs230-proof.txt
        if-no-files-found: warn
