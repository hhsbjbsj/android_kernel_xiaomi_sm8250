name: Scene eBPF Capability Build

on:
  push:
    branches:
      - scene-ebpf-5.15-complete
  workflow_dispatch:
    inputs:
      device:
        description: Target device codename
        required: true
        default: lmi
        type: string
      target_os:
        description: Target OS
        required: true
        default: aosp
        type: choice
        options:
          - aosp
          - miui

permissions:
  contents: read

jobs:
  scene-ebpf-build:
    runs-on: ubuntu-22.04
    env:
      DEVICE: ${{ github.event_name == 'workflow_dispatch' && inputs.device || 'lmi' }}
      TARGET_OS: ${{ github.event_name == 'workflow_dispatch' && inputs.target_os || 'aosp' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build and BTF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex gawk git gnupg gperf imagemagick \
            libncurses-dev lib32readline-dev lib32z1-dev liblz4-tool libsdl1.2-dev \
            libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool \
            squashfs-tools xsltproc zip zlib1g-dev python3 dwarves
          echo "pahole: $(command -v pahole)"
          pahole --version

      - name: Setup zyc-clang 16
        run: |
          mkdir -p "$HOME/zyc-clang"
          cd "$HOME/zyc-clang"
          wget -q https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260510-release/Clang-16.0.6-20260510.tar.gz
          tar -xzf Clang-16.0.6-20260510.tar.gz
          "$HOME/zyc-clang/bin/clang" --version

      - name: Static capability audit
        run: |
          set -eux
          grep -q 'config DEBUG_INFO_BTF' lib/Kconfig.debug
          grep -q 'sysfs_btf.o' kernel/bpf/Makefile
          grep -q 'kobject_create_and_add("btf"' kernel/bpf/sysfs_btf.c
          grep -q 'bpf_probe_read_user_proto' kernel/trace/bpf_trace.c
          grep -q 'bpf_probe_read_kernel_proto' kernel/trace/bpf_trace.c
          grep -q 'BPF_F_ALLOW_MULTI' kernel/bpf/cgroup.c
          grep -q 'struct bpf_sock_addr, user_port' net/core/filter.c
          grep -q 'BPF_CGROUP_INET4_BIND' include/uapi/linux/bpf.h
          grep -q 'BPF_CGROUP_INET6_BIND' include/uapi/linux/bpf.h
          grep -q 'BPF_CGROUP_INET4_CONNECT' include/uapi/linux/bpf.h
          grep -q 'BPF_CGROUP_INET6_CONNECT' include/uapi/linux/bpf.h

      - name: Build and validate Scene eBPF kernel capabilities
        run: |
          chmod +x build_scene_ebpf.sh build_kernel.sh
          ./build_scene_ebpf.sh "$DEVICE" "$TARGET_OS"

      - name: Upload validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Scene-eBPF-${{ env.DEVICE }}-${{ env.TARGET_OS }}-${{ github.run_id }}
          if-no-files-found: error
          compression-level: 0
          path: |
            APTKernel_*.zip
            out_${{ env.TARGET_OS }}/.config
            out_${{ env.TARGET_OS }}/vmlinux.btf
            out_${{ env.TARGET_OS }}/vmlinux.sections.txt
